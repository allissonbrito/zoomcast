name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg
        shell: pwsh
        run: |
          # ponytail: FFmpeg GPL (BtbN) p/ beta; trocar por build LGPL + aviso de licenca no 1.0
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          $b = (Resolve-Path "ff/*/bin").Path
          "$b" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc -p zoomcast-gui -p zoomcast-cli
      - name: Empacotar
        shell: pwsh
        run: |
          $d = "zoomcast-beta"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/zoomcast-gui.exe $d
          Copy-Item target/x86_64-pc-windows-msvc/release/zoomcast-cli.exe $d
          Copy-Item ff/*/bin/ffmpeg.exe, ff/*/bin/ffprobe.exe $d
          Copy-Item LICENSE $d
          Compress-Archive "$d/*" zoomcast-beta-windows-x64.zip
          (Get-FileHash zoomcast-beta-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  zoomcast-beta-windows-x64.zip" | Out-File -Encoding ascii zoomcast-beta-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zoomcast-beta-windows-x64
          path: zoomcast-beta-windows-x64.zip*
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.1.0-beta.${{ github.run_number }}" zoomcast-beta-windows-x64.zip zoomcast-beta-windows-x64.zip.sha256 --prerelease --title "Zoomcast Beta ${{ github.run_number }}" --notes "Beta Windows x64. Descompacte o zip inteiro e execute zoomcast-gui.exe. SHA-256 no arquivo .sha256."
